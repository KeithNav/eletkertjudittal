# strapi.eletkertjudittal.hu - nginx site (a szerveren: /etc/nginx/sites-available/strapi)
# Feltoltes: powershell -ExecutionPolicy Bypass -File scripts\deploy.ps1 -Target nginx   (mentes + nginx -t + reload)
# FIGYELEM: a szerveren masik elo oldal is fut (bellawellfizio.hu), ahhoz ne nyulj; csak ezt a site-ot kezeli a script.
server {
	server_name strapi.eletkertjudittal.hu;

	location / {
		proxy_pass http://localhost:1337;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		client_max_body_size 256m;
	}


    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/eletkertjudittal.hu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/eletkertjudittal.hu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = strapi.eletkertjudittal.hu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


	server_name strapi.eletkertjudittal.hu;
    listen 80;
    return 404; # managed by Certbot


}
