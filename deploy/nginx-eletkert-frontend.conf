# eletkertjudittal.hu - nginx site (a szerveren: /etc/nginx/sites-available/frontend)
# Feltoltes: powershell -ExecutionPolicy Bypass -File scripts\deploy.ps1 -Target nginx   (mentes + nginx -t + reload)
# FIGYELEM: a szerveren masik elo oldal is fut (bellawellfizio.hu), ahhoz ne nyulj; csak ezt a site-ot kezeli a script.
server {
    server_name eletkertjudittal.hu www.eletkertjudittal.hu;

    root /var/www/eletkert;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/eletkertjudittal.hu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/eletkertjudittal.hu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = eletkertjudittal.hu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name eletkertjudittal.hu;
    return 404; # managed by Certbot
    return 301 https://$host$request_uri;

}

server {
    listen 80;
    server_name www.eletkertjudittal.hu;

    ssl_certificate /etc/letsencrypt/live/eletkertjudittal.hu/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/eletkertjudittal.hu/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 

    return 301 https://eletkertjudittal.hu$request_uri;
}
