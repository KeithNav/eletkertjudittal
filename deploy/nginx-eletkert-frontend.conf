# eletkertjudittal.hu - nginx site (a szerveren: /etc/nginx/sites-available/frontend)
# Feltoltes: powershell -ExecutionPolicy Bypass -File scripts\deploy.ps1 -Target nginx   (mentes + nginx -t + reload)
# FIGYELEM: a szerveren masik elo oldal is fut (bellawellfizio.hu), ahhoz ne nyulj; csak ezt a site-ot kezeli a script.

server {
    server_name eletkertjudittal.hu;

    root /var/www/eletkert;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json application/manifest+json text/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Ugyanaz a tartalom ne legyen tobb URL-en: /index.html -> /, /oldal.html -> /oldal
    # ($request_uri az eredeti kerest nezi, igy az index direktiva belso atiranyitasa nem okoz hurkot)
    if ($request_uri ~ ^/index\.html(\?.*)?$) { return 301 /; }
    if ($request_uri ~ ^/(galeria|receptek|impresszum|adatkezelesi-tajekoztato)\.html(\?.*)?$) { return 301 /$1; }

    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # A /assets/ fajlnevei tartalom-hash-t hordoznak, ezert orokre gyorsitotarazhatok.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location ~* \.(png|jpe?g|webp|svg|ico|pdf)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # A HTML mindig ellenorzesre kerul, hogy deploy utan ne a regi (mar torolt) hash-es fajlokra hivatkozzon.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/eletkertjudittal.hu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/eletkertjudittal.hu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www -> eletkertjudittal.hu (egyetlen kanonikus host)
server {
    server_name www.eletkertjudittal.hu;

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/eletkertjudittal.hu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/eletkertjudittal.hu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://eletkertjudittal.hu$request_uri;
}

# http -> https a kanonikus hostra, egyetlen atiranyitassal
server {
    listen 80;
    server_name eletkertjudittal.hu www.eletkertjudittal.hu;

    return 301 https://eletkertjudittal.hu$request_uri;
}
